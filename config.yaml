# FinSights 配置
# 模型信息的查证记录见 docs/questions.md（附官方文档链接）。
#
# 2026-10-09：运行模型由 agnes-3.0-flash 切到 deepseek-flash（DeepSeek-V4.1-Flash）。
# 原因：Agnes 免费档实测约 10 RPM 有效上限（见 llm.rate_limit_rpm 注释），一轮 7 题要等很久；
#       DeepSeek 官方限流是**并发 2500/账号**而不是 RPM/TPM，没有每分钟速率上限。
# 代价：DeepSeek 没有免费额度，按量计费（off-peak 输入 $0.15 / 输出 $0.60 每百万 token）。
# 2026-10-09 官方文档查证：
#   模型与价格 https://api-docs.deepseek.com/quick_start/pricing
#   限流与隔离 https://api-docs.deepseek.com/quick_start/rate_limit
#   thinking    https://api-docs.deepseek.com/guides/thinking_mode
#   工具调用    https://api-docs.deepseek.com/guides/tool_calls
#
# 切回 Agnes：改回下面标了 [Agnes] 的行即可，无需改代码。
llm:
  base_url: https://api.deepseek.com    # [Agnes] https://api.agnes-ai.cn/v1（中国站；国际站对该 key 401）
  model: deepseek-flash         # [Agnes] agnes-3.0-flash。deepseek-flash 即 DeepSeek-V4.1-Flash
  api_key_env: DEEPSEEK_API_KEY # [Agnes] LLM_API_KEY。从 .env 的这个变量读 key；值本身不入库/不进运行包
  temperature_agent: 0.2         # agent 主循环
  temperature_judge: 0.0         # LLM-as-judge / 结论抽取
  # questions.md Q2 答复：不依赖 API 默认值，显式关闭 thinking（可复现性；P8 再做开启的对照实验）
  enable_thinking:
    agent: false
    judge: false
  # DeepSeek 的 thinking 默认是 enabled、effort high，必须显式关；且参数名与 Agnes/Qwen 不同，
  # 由本项选择厂商写法（实现见 agent/llm.py::_thinking_extra_body）。
  thinking_param: deepseek      # [Agnes] chat_template
                                #   deepseek      -> {"thinking": {"type": "disabled"}}
                                #   chat_template -> {"chat_template_kwargs": {"enable_thinking": false}}
  timeout_s: 180
  max_retries: 3                 # 重试次数（总尝试 = max_retries + 1）；退避策略见下方 retry_*
  max_output_tokens_main: 8000   # 主循环输出上限（交接 A1）；DeepSeek 最大输出 384K，这里按需限制
  max_output_tokens_summary: 4000  # L5 摘要输出上限
  # 共享客户端限速（每分钟请求数；限速点在 LLMClient 内、含其 429 重试）。
  # 0 = 关闭客户端节流。DeepSeek 官方限的是**并发**（flash 2500/账号）而不是 RPM/TPM
  # （https://api-docs.deepseek.com/quick_start/rate_limit），本项目主循环与子 Agent 都串行发请求，
  # 并发恒为 1，不需要客户端节流；确需节流时用 --max-rpm N 临时打开，不改本文件。
  # 保留 Agnes 时的实测依据（2026-10-09，runs/rate_limit_probe_20261009.json）：
  #   8 RPM 8/8 成功、10 RPM 10/10 成功、12 RPM 第 11 次收到 429，且 429 无 Retry-After。
  #   与"约 10 RPM 有效上限"相符，但一次短探测不足以断言精确硬上限，当时因此取保守值 8。
  rate_limit_rpm: 0              # [Agnes] 8
  retry_base_s: 4.0              # 429 且服务端未给 Retry-After 时的退避基数（秒）
  retry_cap_s: 30.0              # 单次退避上限（秒），保证等待有界；总等待仍受 max_retries 限制
  retry_jitter: 0.5              # 退避随机抖动幅度（±50%），避免多进程/多角色齐步重试
  pricing_usd_per_mtok:          # list 价（DeepSeek off-peak；peak 为 2 倍，
                                #   高峰 UTC 工作日 01:00-04:00 与 06:00-10:00）
                                # [Agnes] 推广期实际 $0，按 list 价记账作为成本上界
    input: 0.15                  # [Agnes] 0.05
    output: 0.60                 # [Agnes] 0.15

agent:
  max_steps: 20
  max_tokens_budget: 500000      # 单次运行的 token 预算
  # 单次运行的墙钟预算。开发阶段放大：用户 2026-10-09 指示开发期把步数放到 100 轮，
  # 而 600s 会在 100 轮×约 5s/步时先一步拒答，使基线跑不完（真上限变成墙钟而非步数）。
  # 稳定后应调回；multi_agent 模式不受本项约束（2026-10-06 裁定已取消其墙钟上限）。
  max_wall_s: 1800
  final_answer_max_retries: 2    # 护栏打回重做的最大次数

context:
  # 交接回答二（2026-10-02）候选起点：显式 token 阈值（不再用比例×有效窗口的耦合方式）
  window: 512000                 # 正式窗口保持；16K 仅用于 V4.44 压力测试
  reserve_output: 20000          # 本地余量（不等于 API 输出上限）
  l3_trigger_tokens: 64000       # L3 轻清理触发（视图估算 token > 此值）
  compact_target_tokens: 80000   # 回落目标（候选参数，暂未接线：L4 现为批量模式；对照实验时再接）
  compact_threshold: 128000      # L4 账本压缩触发
  clear_at_least: 8000           # 单批至少释放的 token 数
  stub_keep_last: 6              # L3 保留最近 N 个结果不压缩（候选 6）
  ledger_keep_recent_turns: 4    # L4 保留最近 N 轮（候选 4）
  l3_ratio: 0.1300813            # 旧比例接口保留但不再使用（优先显式 l3_trigger_tokens；plan 已登记）
  l5_enabled: false              # 正式业务默认关闭 L5；16K 压测单独覆盖
  l5_keep_last_turns: 1          # L5 摘要之后逐字保留的最近轮数
  skill_reinject_max_tokens: 3000  # L4/L5 之后重注入 skills 的 token 上限
  reactive_max_retries: 3        # 上下文超长兜底：PTL 按轮次丢弃的重试上限（V4.41）
  compact_fail_limit: 3          # 连续压缩失败 N 次 → 熔断，status=refuse（V4.42）
  active_protect_results: 6      # 活动证据保护：默认保留最近 N 个完整结果
  active_protect_turns: 4        # 活动证据保护：默认保留最近 N 轮交互
  token_safety_margin: 1.05      # 估算 × 安全余量
  result_max_rows: 50            # L1 结果预算：工具结果最多显示行数
  result_max_tokens: 2000        # L1 结果预算：超过约多少 token 就只放引用+预览
  disclosure_dir: data/disclosures  # 披露检索库（etl.disclosures 生成；as_of 过滤见 agent/disclosure.py）

# 第一阶段（PRD 评测与优化 3.2）：初始数据包规则——固定、可配置，不按参考答案挑选
initial_packet:
  metrics: [inventory, revenue, cogs, accounts_receivable, accounts_payable]
  quarters_back: 8          # 自问题期间（含）向前 N 个连续财季；期间未解析时取库内最近 N 期

# multi_agent 模式（handoff_multi_agent_attribution_development.md「最新裁定」2026-10-06）：
# 开发阶段只以【最大轮数】控制运行——每轮＝一次模型请求。资源停止上限（时间/token/子调用总数/
# 任务图节点数/单节点尝试次数/计划修订次数/最终答案修订次数）已全部取消，仅完整记录消耗，不再据此提前停止。
# 主循环轮数沿用 budget.max_steps；下面四个是各角色自身的最大轮数（候选起点，非验收标准）。
# 正确性校验（依赖/版本/角色权限/数据性质/引用/最终审查）不受影响，仍会拒绝非法调用。
multi_agent:
  main_max_steps: 20        # 展示用兜底；实际生效值 = budget.max_steps（与 single 共用）
  planner_max_steps: 4      # Planner 子 Agent 每次调用的最大轮数
  worker_max_steps: 6       # Worker 子 Agent 每次调用的最大轮数（含预留收尾轮）
  reviewer_max_steps: 4     # Reviewer 子 Agent 每次调用的最大轮数