# FinSights 配置
# 模型信息的查证记录见 docs/questions.md（附官方文档链接）。
# 2026-10-01：出于成本考虑，LLM 由 DeepSeek V4.1 Flash 切换为 Agnes AI 免费模型（PRD 4.6 批注）。

llm:
  base_url: https://api.agnes-ai.cn/v1   # 中国站端点；这把 key 在国际站 apihub.agnes-ai.com 无效（实测 401）
  model: agnes-3.0-flash         # Agnes 旗舰模型，限时免费（list 价 $0.05/$0.15 每百万 token）
  temperature_agent: 0.2         # agent 主循环
  temperature_judge: 0.0         # LLM-as-judge / 结论抽取
  # questions.md Q2 答复：不依赖 API 默认值，显式关闭 thinking（可复现性；P8 再做开启的对照实验）
  enable_thinking:
    agent: false
    judge: false
  timeout_s: 120
  max_retries: 3                 # 指数退避
  rate_limit_rpm: 18             # 客户端限速（免费档约 20 RPM，留余量；runner 令牌桶用）
  pricing_usd_per_mtok:          # list 价（推广期实际 $0，按 list 价记账作为成本上界）
    input: 0.05
    output: 0.15

agent:
  max_steps: 20
  max_tokens_budget: 500000      # 单次运行的 token 预算
  max_wall_s: 600                # 单次运行的时间预算（plan 6.2 Budget：步数、token、时间）
  final_answer_max_retries: 2    # 护栏打回重做的最大次数

context:
  # 有效窗口 = window - reserve_output（为摘要输出预留）
  # L4/L5 触发阈值 = compact_threshold（= 有效窗口 - 13000，plan 6.6.4）
  window: 512000                 # agnes-3.0-flash 官方上下文长度；压缩实验时临时调小（如 16000）
  reserve_output: 20000          # 为摘要/回答输出预留
  compact_threshold: 479000      # L4 账本压缩 / L5 全量摘要触发阈值
  clear_at_least: 8000           # L3 存根化至少要释放的 token 数
  l3_ratio: 0.5                  # L3 触发：视图 token 数 > 该比例 × 有效窗口
  stub_keep_last: 3              # L3 保留最近 N 个结果不压缩
  ledger_keep_recent_turns: 2    # L4 保留最近 N 轮
  skill_reinject_max_tokens: 3000  # L4/L5 之后重注入 skills 的 token 上限
  reactive_max_retries: 3        # 上下文超长兜底：PTL 按轮次丢弃的重试上限（V4.41）
  compact_fail_limit: 3          # 连续压缩失败 N 次 → 熔断，status=refuse（V4.42）
  l5_enabled: true               # L5 全量摘要需要 ctx.llm；纯 L2–L4 的测试上下文不设此键即关闭
  l5_keep_last_turns: 1          # L5 摘要之后逐字保留的最近轮数
  result_max_rows: 50            # L1 结果预算：工具结果最多显示行数
  result_max_tokens: 2000        # L1 结果预算：超过约多少 token 就只放引用+预览
