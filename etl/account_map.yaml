# 标准科目表（plan 附录 A）与数据源映射
# - accounts: 标准科目（入库 accounts 表）
# - lenovo_bs_sections: 联想综合资产负债表行 → 标准科目（按报表小节消歧：貸款/遞延收益 同名两节）
# - lenovo_is: 联想综合损益表行 → 标准科目（利润表只需关键行）
# - xbrl_tags: SEC companyfacts 标签 → 标准科目；optional_ 标签缺失时由残差吸收（见 load_db.py）

accounts:
  # ---- 资产 ----
  - {code: cash,                        name_zh: 现金及现金等价物,      name_en: Cash and cash equivalents,           statement: BS, parent_code: total_current_assets,  is_total: false, sign: 1}
  - {code: short_term_investments,      name_zh: 短期投资,              name_en: Short-term investments,               statement: BS, parent_code: total_current_assets,  is_total: false, sign: 1}
  - {code: accounts_receivable,         name_zh: 应收账款,              name_en: Accounts receivable,                  statement: BS, parent_code: total_current_assets,  is_total: false, sign: 1}
  - {code: inventory,                   name_zh: 存货,                  name_en: Inventory,                            statement: BS, parent_code: total_current_assets,  is_total: false, sign: 1}
  - {code: other_current_assets,        name_zh: 其他流动资产,          name_en: Other current assets,                 statement: BS, parent_code: total_current_assets,  is_total: false, sign: 1}
  - {code: total_current_assets,        name_zh: 流动资产合计,          name_en: Total current assets,                 statement: BS, parent_code: total_assets,          is_total: true,  sign: 1}
  - {code: ppe_net,                     name_zh: 固定资产净额,          name_en: PP&E, net,                            statement: BS, parent_code: total_assets,          is_total: false, sign: 1}
  - {code: goodwill,                    name_zh: 商誉,                  name_en: Goodwill,                             statement: BS, parent_code: total_assets,          is_total: false, sign: 1}
  - {code: intangibles,                 name_zh: 无形资产,              name_en: Intangible assets,                    statement: BS, parent_code: total_assets,          is_total: false, sign: 1}
  - {code: other_noncurrent_assets,     name_zh: 其他非流动资产,        name_en: Other noncurrent assets,              statement: BS, parent_code: total_assets,          is_total: false, sign: 1}
  - {code: total_assets,                name_zh: 总资产,                name_en: Total assets,                         statement: BS, parent_code: "",                    is_total: true,  sign: 1}
  # ---- 负债 ----
  - {code: accounts_payable,            name_zh: 应付账款,              name_en: Accounts payable,                     statement: BS, parent_code: total_current_liabilities, is_total: false, sign: 1}
  - {code: short_term_debt,             name_zh: 短期借款,              name_en: Short-term debt,                      statement: BS, parent_code: total_current_liabilities, is_total: false, sign: 1}
  - {code: accrued_liabilities,         name_zh: 应计费用,              name_en: Accrued liabilities,                  statement: BS, parent_code: total_current_liabilities, is_total: false, sign: 1}
  - {code: deferred_revenue_current,    name_zh: 合同负债（流动）,      name_en: Deferred revenue, current,            statement: BS, parent_code: total_current_liabilities, is_total: false, sign: 1}
  - {code: other_current_liabilities,   name_zh: 其他流动负债,          name_en: Other current liabilities,            statement: BS, parent_code: total_current_liabilities, is_total: false, sign: 1}
  - {code: total_current_liabilities,   name_zh: 流动负债合计,          name_en: Total current liabilities,            statement: BS, parent_code: total_liabilities,     is_total: true,  sign: 1}
  - {code: long_term_debt,              name_zh: 长期借款,              name_en: Long-term debt,                       statement: BS, parent_code: total_liabilities,     is_total: false, sign: 1}
  - {code: other_noncurrent_liabilities, name_zh: 其他非流动负债,       name_en: Other noncurrent liabilities,         statement: BS, parent_code: total_liabilities,     is_total: false, sign: 1}
  - {code: total_liabilities,           name_zh: 总负债,                name_en: Total liabilities,                    statement: BS, parent_code: "",                    is_total: true,  sign: 1}
  # ---- 权益 ----
  - {code: noncontrolling_interest,     name_zh: 少数股东权益,          name_en: Noncontrolling interests,             statement: BS, parent_code: total_equity,          is_total: false, sign: 1}
  - {code: total_equity,                name_zh: 所有者权益合计,        name_en: Total equity (incl. NCI),             statement: BS, parent_code: total_liabilities_and_equity, is_total: true, sign: 1}
  - {code: total_liabilities_and_equity, name_zh: 负债和所有者权益总计, name_en: Total liabilities and equity,         statement: BS, parent_code: "",                    is_total: true,  sign: 1}
  # ---- 利润表（SFR 关键行）----
  - {code: revenue,                     name_zh: 营业收入,              name_en: Revenue,                              statement: IS, parent_code: "",                    is_total: true,  sign: 1}
  - {code: cogs,                        name_zh: 营业成本,              name_en: Cost of revenue,                      statement: IS, parent_code: "",                    is_total: false, sign: 1}
  - {code: gross_profit,                name_zh: 毛利,                  name_en: Gross profit,                         statement: IS, parent_code: "",                    is_total: true,  sign: 1}
  - {code: operating_income,            name_zh: 经营利润,              name_en: Operating income,                     statement: IS, parent_code: "",                    is_total: true,  sign: 1}
  - {code: net_income,                  name_zh: 净利润,                name_en: Net income,                           statement: IS, parent_code: "",                    is_total: true,  sign: 1}

# 联想资产负债表（繁体原文行 → 标准科目）。映射原则：
# 1) 應收貿易賬款+應收票據 → accounts_receivable（与同行 ARNet 口径对齐）
# 2) 應付票據（供应链金融票据）→ other_current_liabilities，AP 只含應付貿易賬款（与联想自身 DPO 口径一致）
# 3) 銀行存款 → short_term_investments（对齐同行的 short-term investments）
# 4) 在建工程并入 ppe_net；預付土地租賃款項/聯營合營/遞延稅資產/可供出售 → other_noncurrent_assets
# 5) 永續證券、股本、儲備不单列：total_equity 直接取報表"總權益"（含 NCI，与附录 A 口径一致）
lenovo_bs_sections:
  非流動資產:
    物業、廠房及設備: ppe_net
    在建工程: ppe_net
    預付土地租賃款項: other_noncurrent_assets
    無形資產: intangibles
    於聯營公司及合營公司權益: other_noncurrent_assets
    遞延所得稅項資產: other_noncurrent_assets
    可供出售金融資產: other_noncurrent_assets
    以公允價值計量且其變動計入損益的金融資產: other_noncurrent_assets
    以公允值計量且其變動計入損益的金融資產: other_noncurrent_assets
    以公允價值計量且其變動計入其他全面收益的金融資產: other_noncurrent_assets
    以公允值計量且其變動計入其他全面收益的金融資產: other_noncurrent_assets
    金融資產: other_noncurrent_assets
    使用權資產: other_noncurrent_assets
    其他非流動資產: other_noncurrent_assets
  流動資產:
    存貨: inventory
    應收貿易賬款: accounts_receivable
    應收票據: accounts_receivable
    應收貿易賬款及票據: accounts_receivable
    應收貿易賬款、租賃款及票據: accounts_receivable
    銀行存款: short_term_investments
    現金及現金等價物: cash
    衍生金融資產: other_current_assets
    按金、預付款項及其他應收賬款: other_current_assets
    可收回所得稅款: other_current_assets
  權益:
    其他非控制性權益: noncontrolling_interest
    向非控制性權益簽出認沽期權: noncontrolling_interest   # 权益中列示的负值
    總權益: total_equity
  非流動負債:
    貸款: long_term_debt
    保修費撥備: other_noncurrent_liabilities
    遞延收益: other_noncurrent_liabilities
    退休福利責任: other_noncurrent_liabilities
    遞延所得稅項負債: other_noncurrent_liabilities
    衍生金融負債: other_noncurrent_liabilities
    其他非流動負債: other_noncurrent_liabilities
  流動負債:
    應付貿易賬款: accounts_payable
    應付票據: other_current_liabilities
    應付貿易賬款及票據: accounts_payable
    衍生金融負債: other_current_liabilities
    其他應付賬款及應計費用: accrued_liabilities
    撥備: other_current_liabilities
    遞延收益: deferred_revenue_current
    應付所得稅項: other_current_liabilities
    貸款: short_term_debt

# 小计/合计行（跨小节，直接命中）
lenovo_bs_totals:
  總資產: total_assets
  總負債: total_liabilities
  總權益: total_equity
  總權益及負債: total_liabilities_and_equity

lenovo_is:
  收入: revenue
  銷售成本: cogs
  毛利: gross_profit
  經營(虧損)/溢利: operating_income
  經營溢利: operating_income
  經營(虧損)/溢利除稅前: ""
  期內(虧損)/溢利: net_income
  期內溢利: net_income

# 权益组件行：不映射为标准科目（已包含在"總權益"合计中，total_equity 直接取合计行）
lenovo_bs_ignored:
  - 股本
  - 儲備
  - 公司權益持有人應佔權益
  - 永續證券

# SEC XBRL 标签 → 标准科目（HP 与 Dell 共用基础表，per-company 覆盖见下）
xbrl_tags:
  Assets: total_assets
  AssetsCurrent: total_current_assets
  InventoryNet: inventory
  AccountsReceivableNetCurrent: accounts_receivable
  CashAndCashEquivalentsAtCarryingValue: cash
  ShortTermInvestments: short_term_investments
  AccountsPayableCurrent: accounts_payable
  Goodwill: goodwill
  IntangibleAssetsNetExcludingGoodwill: intangibles
  PropertyPlantAndEquipmentNet: ppe_net
  LiabilitiesCurrent: total_current_liabilities
  LongTermDebtCurrent: short_term_debt
  ShortTermBorrowings: short_term_debt
  CommercialPaper: short_term_debt
  LongTermDebtNoncurrent: long_term_debt
  Liabilities: total_liabilities
  StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest: total_equity
  MinorityInterest: noncontrolling_interest
  LiabilitiesAndStockholdersEquity: total_liabilities_and_equity
  Revenues: revenue
  RevenueFromContractWithCustomerExcludingAssessedTax: revenue
  CostOfRevenue: cogs
  CostOfGoodsAndServicesSold: cogs
  GrossProfit: gross_profit

# 残差吸收：reported_total − Σ已映射子项 → other_*（plan 3.3）
residual_rules:
  - {total: total_current_assets,  known: [cash, short_term_investments, accounts_receivable, inventory], absorb: other_current_assets}
  - {total: total_assets,          known: [total_current_assets, ppe_net, goodwill, intangibles],          absorb: other_noncurrent_assets}
  - {total: total_current_liabilities, known: [accounts_payable, short_term_debt, accrued_liabilities, deferred_revenue_current], absorb: other_current_liabilities}
  - {total: total_liabilities,     known: [total_current_liabilities, long_term_debt],                     absorb: other_noncurrent_liabilities}
