[project]
name = "finsights"
version = "0.1.0"
description = "FinSights Data Agent — 可信、可评测的财务数据 agent"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["etl*", "semantic*", "fincalc*", "agent*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
