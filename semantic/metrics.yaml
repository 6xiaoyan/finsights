# 语义层指标定义（plan 4.2）：base=直接取科目；derived=公式计算（确定性）
# dims: company/period 全部支持；region/product_line 仅标注 detail 的科目支持（facts_detail）
metrics:
  - name: accounts_payable
    label_zh: 应付账款
    type: base
    account: accounts_payable
    unit: usd_mn
    dims: [company, period]
  - name: accounts_receivable
    label_zh: 应收账款
    type: base
    account: accounts_receivable
    unit: usd_mn
    dims: [company, period, region, product_line]
  - name: accrued_liabilities
    label_zh: 应计费用
    type: base
    account: accrued_liabilities
    unit: usd_mn
    dims: [company, period]
  - name: cash
    label_zh: 现金及现金等价物
    type: base
    account: cash
    unit: usd_mn
    dims: [company, period]
  - name: cogs
    label_zh: 营业成本
    type: base
    account: cogs
    unit: usd_mn
    dims: [company, period]
  - name: deferred_revenue_current
    label_zh: 合同负债(流动)
    type: base
    account: deferred_revenue_current
    unit: usd_mn
    dims: [company, period]
  - name: deferred_revenue_noncurrent
    label_zh: 合同负债(非流动)
    type: base
    account: deferred_revenue_noncurrent
    unit: usd_mn
    dims: [company, period]
  - name: financing_receivables
    label_zh: 融资应收款(流动)
    type: base
    account: financing_receivables
    unit: usd_mn
    dims: [company, period]
  - name: goodwill
    label_zh: 商誉
    type: base
    account: goodwill
    unit: usd_mn
    dims: [company, period]
  - name: gross_profit
    label_zh: 毛利
    type: base
    account: gross_profit
    unit: usd_mn
    dims: [company, period]
  - name: intangibles
    label_zh: 无形资产
    type: base
    account: intangibles
    unit: usd_mn
    dims: [company, period]
  - name: inventory
    label_zh: 存货
    type: base
    account: inventory
    unit: usd_mn
    dims: [company, period, region, product_line]
  - name: long_term_debt
    label_zh: 长期借款
    type: base
    account: long_term_debt
    unit: usd_mn
    dims: [company, period]
  - name: net_income
    label_zh: 净利润
    type: base
    account: net_income
    unit: usd_mn
    dims: [company, period]
  - name: noncontrolling_interest
    label_zh: 少数股东权益
    type: base
    account: noncontrolling_interest
    unit: usd_mn
    dims: [company, period]
  - name: operating_income
    label_zh: 经营利润
    type: base
    account: operating_income
    unit: usd_mn
    dims: [company, period]
  - name: other_current_assets
    label_zh: 其他流动资产
    type: base
    account: other_current_assets
    unit: usd_mn
    dims: [company, period]
  - name: other_current_liabilities
    label_zh: 其他流动负债
    type: base
    account: other_current_liabilities
    unit: usd_mn
    dims: [company, period]
  - name: other_noncurrent_assets
    label_zh: 其他非流动资产
    type: base
    account: other_noncurrent_assets
    unit: usd_mn
    dims: [company, period]
  - name: other_noncurrent_liabilities
    label_zh: 其他非流动负债
    type: base
    account: other_noncurrent_liabilities
    unit: usd_mn
    dims: [company, period]
  - name: ppe_net
    label_zh: 固定资产净额
    type: base
    account: ppe_net
    unit: usd_mn
    dims: [company, period]
  - name: revenue
    label_zh: 营业收入
    type: base
    account: revenue
    unit: usd_mn
    dims: [company, period, region, product_line]
  - name: short_term_debt
    label_zh: 短期借款
    type: base
    account: short_term_debt
    unit: usd_mn
    dims: [company, period]
  - name: short_term_investments
    label_zh: 短期投资
    type: base
    account: short_term_investments
    unit: usd_mn
    dims: [company, period]
  - name: total_assets
    label_zh: 总资产
    type: base
    account: total_assets
    unit: usd_mn
    dims: [company, period]
  - name: total_current_assets
    label_zh: 流动资产合计
    type: base
    account: total_current_assets
    unit: usd_mn
    dims: [company, period]
  - name: total_current_liabilities
    label_zh: 流动负债合计
    type: base
    account: total_current_liabilities
    unit: usd_mn
    dims: [company, period]
  - name: total_equity
    label_zh: 所有者权益合计
    type: base
    account: total_equity
    unit: usd_mn
    dims: [company, period]
  - name: total_liabilities
    label_zh: 总负债
    type: base
    account: total_liabilities
    unit: usd_mn
    dims: [company, period]
  - name: total_liabilities_and_equity
    label_zh: 负债和所有者权益总计
    type: base
    account: total_liabilities_and_equity
    unit: usd_mn
    dims: [company, period]
  - name: gross_margin
    label_zh: 毛利率
    type: derived
    formula: "gross_profit / revenue"
    unit: ratio
    dims: [company, period]
  - name: dio
    label_zh: 存货周转天数
    type: derived
    formula: "avg(inventory, inventory_prev) / cogs * days"
    unit: days
    dims: [company, period]
  - name: dso
    label_zh: 应收账款周转天数
    type: derived
    formula: "avg(accounts_receivable, accounts_receivable_prev) / revenue * days"
    unit: days
    dims: [company, period]
  - name: dpo
    label_zh: 应付账款周转天数
    type: derived
    formula: "avg(accounts_payable, accounts_payable_prev) / cogs * days"
    unit: days
    dims: [company, period]
  - name: ccc
    label_zh: 现金转换周期
    type: derived
    formula: "dio + dso - dpo"
    unit: days
    dims: [company, period]
  - name: current_ratio
    label_zh: 流动比率
    type: derived
    formula: "total_current_assets / total_current_liabilities"
    unit: ratio
    dims: [company, period]
  - name: debt_to_equity
    label_zh: 负债权益比
    type: derived
    formula: "total_liabilities / total_equity"
    unit: ratio
    dims: [company, period]
